name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      base:
        description: Optional base revision for affected validation
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Resolve affected comparison
        id: comparison
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE: ${{ github.event.before }}
          MANUAL_BASE: ${{ inputs.base }}
        shell: bash
        run: |
          set -euo pipefail
          head="$(git rev-parse HEAD)"
          case "$EVENT" in
            pull_request) base="$PR_BASE"; head="$PR_HEAD" ;;
            push)
              base="$PUSH_BASE"
              if [[ "$base" =~ ^0+$ ]]; then
                empty_tree="$(git hash-object -t tree /dev/null)"
                base="$(git -c user.name=CI -c user.email=ci@example.invalid commit-tree "$empty_tree" -m 'Empty comparison')"
              fi
              ;;
            workflow_dispatch)
              if [[ -n "$MANUAL_BASE" ]]; then
                base="$(git rev-parse --verify --end-of-options "${MANUAL_BASE}^{commit}")"
              else
                base="$(git merge-base origin/main "$head")"
              fi
              ;;
            *) exit 1 ;;
          esac
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "head=$head" >> "$GITHUB_OUTPUT"
          echo "Validation revision: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "Comparison: $base..$head" >> "$GITHUB_STEP_SUMMARY"
      - name: Check formatting
        env:
          TURBO_SCM_BASE: ${{ steps.comparison.outputs.base }}
          TURBO_SCM_HEAD: ${{ steps.comparison.outputs.head }}
        run: pnpm format:check
      - name: Test formatting and hooks
        run: pnpm test
      - name: Record validation result
        if: always()
        env:
          RESULT: ${{ job.status }}
        run: |
          echo 'Commands: pnpm install --frozen-lockfile --ignore-scripts; pnpm format:check; pnpm test' >> "$GITHUB_STEP_SUMMARY"
          echo "Result: $RESULT" >> "$GITHUB_STEP_SUMMARY"
          echo 'Runtime, account, native platform and release acceptance: not applicable; no projects are included.' >> "$GITHUB_STEP_SUMMARY"
